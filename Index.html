<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JUMP PERUGIA</title>

  <meta name="theme-color" content="#090b19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JUMP PERUGIA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./jump_perugia_icon_512.png">
  <link rel="icon" type="image/png" href="./jump_perugia_icon_512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090b19;
      overflow: hidden;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #090b19;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #090b19;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity .25s ease;
    }

    #loading img {
      width: 132px;
      height: 132px;
      border-radius: 28px;
    }

    #loading strong {
      font-size: 22px;
      letter-spacing: .08em;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="./jump_perugia_icon_512.png" alt="JUMP PERUGIA">
    <strong>JUMP PERUGIA</strong>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwuUenbVNzeEyOoHdrrF3K0C-rDjlZnTQvxOcLxF2ADHZbw5L8G6OVS0M5GPECxzcfJ/exec"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hide'), 350);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
